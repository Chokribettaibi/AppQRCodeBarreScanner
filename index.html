<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="QR Code & Barcode Scanner - Manage expiration dates"
    />
    <title>QR Code & Barcode Scanner</title>

    <!-- Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" defer></script>
    <!-- SweetAlert2 for modals -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>

    <!-- CSS -->
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <p class="eyebrow">Inventory Scanner</p>
        <h1>Scanner Product</h1>
        <p class="subtitle">Scan & manage expiration dates</p>
      </header>

      <main class="app-main">
        <section class="camera" aria-label="Camera scanner area">
          <div id="reader" aria-label="Live camera feed"></div>
          <div class="camera-status" id="cameraStatus" aria-live="polite"></div>
        </section>

        <section class="result">
          <h2>Last Scan</h2>
          <div
            id="output"
            class="output-box"
            aria-live="polite"
            aria-atomic="true"
          >
            —
          </div>
          <p class="result-hint">
            Scan a code, then save it with its expiration date.
          </p>
        </section>

        <div class="actions" role="group" aria-label="Scanner controls">
          <button
            id="stopBtn"
            class="btn btn-danger"
            aria-label="Stop camera scanner"
          >
            ⛔ Stop
          </button>
          <button
            id="clearBtn"
            class="btn btn-secondary"
            aria-label="Clear current scan"
          >
            🗑️ Clear
          </button>
          <button
            id="startBtn"
            class="btn btn-success"
            aria-label="Add scan to inventory"
          >
            ➕ Add
          </button>
        </div>
      </main>

      <section class="stock-section" aria-label="Inventory management">
        <div class="section-heading">
          <h2>Inventory</h2>
          <p class="section-subtitle">Your saved scans and expiration dates</p>
        </div>
        <div
          id="stock-result"
          class="stock-container"
          aria-live="polite"
        ></div>
        <div id="stock-status" class="stock-status" aria-live="polite"></div>
      </section>
    </div>

    <script src="js/app.js" defer></script>
  </body>
</html>
